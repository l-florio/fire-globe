<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fire Globe - Data table</title>
  </head>
  <body class="table-page">
    <header id="table-head">
      <div id="view-tabs" class="seg seg3" role="tablist">
        <button type="button" role="tab" id="tab-globe" aria-selected="false" data-i18n="view.globe">Globe</button>
        <button type="button" role="tab" id="tab-table" aria-selected="true" data-i18n="view.table" data-i18n-title="view.table.title" title="Harmonized data by country or region, as a table">Table</button>
        <button type="button" role="tab" id="tab-climatology" aria-selected="false" data-i18n="view.climatology" data-i18n-title="view.climatology.title" title="Typical range of fire detections for this time of year">Climatology</button>
      </div>
      <select id="lang" class="lang-sel" data-i18n-aria="lang.label" data-i18n-title="lang.label" aria-label="Language" title="Language"><option value="en">EN</option><option value="it">IT</option></select>
    </header>
    <main id="table-main"></main>
    <script type="module" src="/src/app/tablePage.ts"></script>
  </body>
</html>
