# Nightly: download the current-year FIRMS data with the MAP_KEY secret, rebuild the recent part,
# merge it with the historical part committed in site_data/, build the app and publish it on GitHub Pages.
#
# Setup (once): Settings > Pages > Source: GitHub Actions; Settings > Secrets and variables > Actions >
# New repository secret FIRMS_MAP_KEY. Without the secret the site is published with the historical data only.

name: Update data and deploy

on:
  schedule:
    - cron: "30 3 * * *" # every day at 03:30 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "globe_kit/**"
      - "site_data/**"
      - "data_pipeline/firms_pipeline.py"
      - "data_pipeline/harmonize.py"
      - "data_pipeline/data/harmonized/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Recent part: from this date to today. Move it forward after rebuilding site_data/ with newer years.
  # It must be the FIRST DAY of a month (and of a year, to match the site_data split): harmonize.py apply needs
  # whole months and refuses a start month without data from its first days.
  RECENT_FROM: "2026-01-01"
  RECENT_SENSORS: "MODIS,VIIRS_SNPP,VIIRS_NOAA20,VIIRS_NOAA21"
  # Single detections of the recent part published on Pages, worldwide (the active sensors only,
  # to stay well under the 1 GB Pages limit). The other years come from POINTS_BASE when set.
  RECENT_POINT_SENSORS: "MODIS,VIIRS_NOAA20"
  # Repository variable (Settings > Variables): URL of the folder with the historical worldwide
  # detections, e.g. https://huggingface.co/datasets/<user>/<name>/resolve/main/
  POINTS_BASE: ${{ vars.POINTS_BASE }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      private: ${{ steps.vis.outputs.private }}
    steps:
      - uses: actions/checkout@v4

      # While the repository is private the site is built and checked but not published (Pages needs a public repo
      # on GitHub Free). Make the repository public to publish.
      - name: Repository visibility
        id: vis
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "private=$(gh api repos/${{ github.repository }} --jq .private)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependencies
        run: pip install -r data_pipeline/requirements.txt -r globe_kit/scripts/requirements.txt

      # Raw API files already downloaded: only new days (and the last week of NRT) are fetched again.
      - uses: actions/cache@v4
        with:
          path: data_pipeline/data/raw/api
          key: firms-api-${{ github.run_id }}
          restore-keys: firms-api-

      - name: Current-year data from FIRMS
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: |
          if [ -z "$FIRMS_MAP_KEY" ]; then
            echo "No FIRMS_MAP_KEY secret: publishing the historical data only."
            exit 0
          fi
          Y0="${RECENT_FROM:0:4}"
          cd data_pipeline
          python firms_pipeline.py --sensors "$RECENT_SENSORS" download-recent --start "$RECENT_FROM"
          python firms_pipeline.py --sensors "$RECENT_SENSORS" build
          python firms_pipeline.py aggregate
          # Harmonized series: frozen coefficients (data/harmonized/coefficients.parquet, in the repo) applied to the new months
          python harmonize.py apply --from "${RECENT_FROM:0:7}"
          H=../data_pipeline/data/harmonized/harm_map.parquet
          cd ../globe_kit
          python scripts/make_fire_frames.py --from-year "$Y0" --scale-from ../site_data/frames/manifest.json --out ../build/recent/frames --harmonized "$H"
          python scripts/make_static_data.py --from-year "$Y0" --tag recent --out ../build/recent/data --harmonized "$H" \
            --region=-180,-90,180,90 --points-sensors "$RECENT_POINT_SENSORS"

      - name: Merge historical and recent data
        run: |
          EXT=""
          if [ -n "$POINTS_BASE" ]; then EXT="--external-points site_data/external_points --points-base $POINTS_BASE"; fi
          python globe_kit/scripts/assemble_site.py --part site_data --part build/recent --out globe_kit/public $EXT

      - name: Check the site data
        run: |
          RECENT=""
          if [ -d build/recent/frames ]; then RECENT="--expect-recent"; fi
          python globe_kit/scripts/check_site.py $RECENT | tee site_check.txt

      - name: Upload the check report
        uses: actions/upload-artifact@v4
        with:
          name: site-check
          retention-days: 7
          path: |
            site_check.txt
            globe_kit/public/frames/manifest.json
            globe_kit/public/data/static.json

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: globe_kit/package-lock.json

      - name: Build the app
        working-directory: globe_kit
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        if: steps.vis.outputs.private == 'false'
        with:
          path: globe_kit/dist

  deploy:
    needs: build
    if: needs.build.outputs.private == 'false'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
